<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海外经营看板 · 脱敏功能演示</title>
<style>
:root{color-scheme:dark;--bg:#0a0e14;--card:#111722;--edge:#263448;--txt:#e6edf3;--muted:#96a5b8;--blue:#3aa0ff;--orange:#ffb340}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 system-ui,"PingFang SC",sans-serif}
main{max-width:1420px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}
small,.note{color:var(--muted)}.warn{padding:12px 16px;border:1px solid #745731;background:#261d11;border-radius:10px;margin:15px 0}
.tabs{display:flex;gap:8px;margin:22px 0 14px;flex-wrap:wrap}
button,select{background:#192334;color:var(--txt);border:1px solid var(--edge);padding:9px 14px;border-radius:9px;cursor:pointer}
button.active{background:var(--blue);color:#001329}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--edge);padding:15px;border-radius:12px;margin-bottom:14px}
.kpi{border-left:3px solid var(--blue)}.val{font-size:23px;font-weight:800;margin-top:5px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.table-wrap{overflow:auto;max-height:65vh}table{border-collapse:separate;border-spacing:0;width:100%;min-width:860px}th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--edge);white-space:nowrap}
th{position:sticky;top:0;background:#192334;z-index:2;cursor:pointer}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
th:first-child{z-index:3;background:#192334}tr:hover td{background:#192334}tr:hover td:first-child{background:#192334}
@media(max-width:640px){main{padding:14px}.val{font-size:20px}}
</style>
</head>
<body>
<main>
<header><h1>海外经营看板 · 演示版</h1>
<small>参考历史 N3 MAX / EOL 看板的数据模型与布局。此文件不包含真实业务数据。</small></header>
<div class="warn"><strong>DEMO ONLY：</strong> 所有数字、SKU 与地区均为虚构示例，不能用于经营分析或决策。</div>
<nav class="tabs"><button id="n3Tab" class="active">新品 N3 MAX</button><button id="eolTab">EOL 产品销售与库存</button></nav>
<section id="content"></section>
<footer class="note">数据来源：SYNTHETIC-NO-BUSINESS-DATA · 转换与校验说明见仓库 docs/</footer>
</main>
<script>
const DATA = {
 N3_COUNTRY:[
  {major:"N3 Max",model:"N3 Max",country:"演示地区A",m7:10,m8:12,m9:15,m10:20,avg710:12.3333,fcst10:25,fba:40,wh:20,unproduced:0,dom:10,transit:5,total:70,unsellable:2,cost:70000}
 ],
 N3_SUMMARY:{m7:10,m8:12,m9:15,m10:20,avg710:12.3333,fcst10:25,fba:40,wh:20,unproduced:0,dom:10,transit:5,total:70,unsellable:2,cost:70000},
 EOL:[{major:"Demo SKU",model:"Demo SKU",country:"",m7:9,m8:9,m9:9,m10:6,avg710:9,fcst10:10,fba:100,wh:80,unproduced:0,dom:20,transit:10,total:200,unsellable:3,cost:10000,refurb_new:5,refurb_used:2,refurb_pending:4,refurb_cost:300,total_after:207}],
 EOL_COUNTRY:[{major:"Demo SKU",model:"Demo SKU",country:"演示地区A",m7:9,m8:9,m9:9,m10:6,avg710:9,fcst10:10,fba:100,wh:80,unproduced:0,dom:20,transit:10,total:200,unsellable:3,cost:10000,refurb_new:5,refurb_used:2,refurb_pending:4,refurb_cost:300,total_after:207}],
 EOL_SUMMARY:{m7:9,m8:9,m9:9,m10:6,avg710:9,fcst10:10,fba:100,wh:80,unproduced:0,dom:20,transit:10,total:200,unsellable:3,cost:10000,refurb_new:5,refurb_used:2,refurb_pending:4,refurb_cost:300,total_after:207},
 meta:{export_date:"DEMO-ONLY",source_file:"SYNTHETIC-NO-BUSINESS-DATA"}
};
const state={tab:"n3",country:"全部",sort:"total",desc:true};
function fmt(v){return typeof v==="number"?v.toLocaleString("zh-CN",{maximumFractionDigits:1}):"-";}
function percent(a,b){return b>0?fmt(a/b*100)+"%":"-";}
function card(label,value,note){return '<div class="card kpi"><small>'+label+'</small><div class="val">'+value+'</div><small>'+note+'</small></div>';}
function choose(tab){state.tab=tab;document.getElementById("n3Tab").classList.toggle("active",tab==="n3");document.getElementById("eolTab").classList.toggle("active",tab==="eol");draw();}
function header(cols){return "<thead><tr>"+cols.map(c=>'<th data-sort="'+c[0]+'">'+c[1]+'</th>').join("")+"</tr></thead>";}
function draw(){
 const isN3=state.tab==="n3";
 const original=isN3?DATA.N3_COUNTRY:DATA.EOL_COUNTRY;
 const s=isN3?DATA.N3_SUMMARY:DATA.EOL_SUMMARY;
 const countries=["全部",...new Set(original.map(r=>r.country))];
 if(!countries.includes(state.country))state.country="全部";
 const rows=original.filter(r=>state.country==="全部"||r.country===state.country).sort((a,b)=>{
  const x=a[state.sort],y=b[state.sort],cmp=(typeof x==="number"&&typeof y==="number")?x-y:String(x??"").localeCompare(String(y??""),"zh");
  return state.desc?-cmp:cmp;
 });
 const kpis=[
  card("总库存（不含售后仓）",fmt(s.total),"FBA+海外仓+国内仓+未生产"),
  card("11月实际销量",fmt(s.m10),"历史示例字段：m10"),
  card("库存金额",fmt(s.cost),"人民币 · 虚构"),
  isN3?card("11月达成率",percent(s.m10,s.fcst10),"实际 ÷ FCST"):card("售后仓当前可售",fmt((s.refurb_new||0)+(s.refurb_used||0)),"全新 + 二手")
 ];
 const cols=[["country","地区"],["major","SKU"],["m10","11月销量"],["fcst10","11月FCST"],["fba","FBA"],["wh","海外仓"],["dom","国内仓"],["unproduced","未生产"],["transit","在途（不重复加总）"],["total","库存合计"],["cost","库存金额"]];
 if(!isN3)cols.push(["refurb_new","售后仓全新"],["refurb_used","售后仓二手"],["refurb_pending","待翻新"],["total_after","含可售售后仓"],["dos","周转天数"]);
 const body=rows.map(r=>"<tr>"+cols.map(c=>{
  const k=c[0];const v=k==="dos"?(r.avg710>0?fmt(r.total/r.avg710*30):"-"):fmtOrText(r[k]);
  return "<td>"+v+"</td>";
 }).join("")+"</tr>").join("");
 const controls='<div class="controls">筛选地区：<select id="country">'+countries.map(c=>'<option'+(c===state.country?" selected":"")+'>'+c+'</option>').join("")+'</select><button id="reset">重置筛选</button><small>点击表头排序；表格可横向滚动</small></div>';
 document.getElementById("content").innerHTML='<div class="kpis">'+kpis.join("")+'</div><div class="card"><h2>'+(isN3?"新品 N3 MAX 国家明细":"EOL SKU/国家明细")+'</h2>'+controls+'<div class="table-wrap"><table>'+header(cols)+'<tbody>'+body+'</tbody></table></div></div>';
 document.getElementById("country").addEventListener("change",e=>{state.country=e.target.value;draw()});
 document.getElementById("reset").addEventListener("click",()=>{state.country="全部";draw()});
 document.querySelectorAll("th[data-sort]").forEach(th=>th.addEventListener("click",()=>{
  const field=th.getAttribute("data-sort");if(field===state.sort)state.desc=!state.desc;else{state.sort=field;state.desc=true;}draw();
 }));
}
function fmtOrText(v){return typeof v==="number"?fmt(v):String(v??"-").replaceAll("<","&lt;");}
document.getElementById("n3Tab").addEventListener("click",()=>choose("n3"));
document.getElementById("eolTab").addEventListener("click",()=>choose("eol"));
draw();
</script>
</body>
</html>
